[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations", ".venv", "staticfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "DJ", "S"]
ignore = [
    "E501",    # line length is handled by the formatter
    "S101",    # assert is fine in tests
    "N818",    # our exception names read better without the Error suffix
    "DJ001",   # null=True on CharField is deliberate where documented
]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["S105", "S106"]
"*/settings/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
