<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto">
    <h1 style="color:#7c3aed">{{ site.SITE_NAME }}</h1>
    <h2>{{ title }}</h2>
    <p>Hi {{ name }},</p>
    <p>{{ body }}</p>
    {% if action_url %}
        <p><a href="{{ action_url }}"
              style="background:#7c3aed;color:#fff;padding:10px 18px;
                     border-radius:8px;text-decoration:none">Open {{ site.SITE_NAME }}</a></p>
    {% endif %}
    <hr>
    <p style="font-size:12px;color:#888">{{ site.SUPPORT_EMAIL }}</p>
</div>
