<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto">
    <h1 style="color:#7c3aed">{{ site.SITE_NAME }}</h1>
    <h2>Reset your password</h2>
    <p>Hi {{ name }},</p>
    <p>Choose a new password. This link expires in {{ ttl_minutes }} minutes.</p>
    <p><a href="/auth/password/reset/{{ token }}/"
          style="background:#7c3aed;color:#fff;padding:10px 18px;
                 border-radius:8px;text-decoration:none">Reset password</a></p>
    <p style="font-size:12px;color:#888">
        Didn't ask for this? No action needed — your password has not changed.</p>
</div>
