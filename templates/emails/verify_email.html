<div style="font-family:Arial,sans-serif;max-width:520px;margin:0 auto">
    <h1 style="color:#7c3aed">{{ site.SITE_NAME }}</h1>
    <h2>Confirm your email address</h2>
    <p>Hi {{ name }},</p>
    <p>Welcome to {{ site.SITE_NAME }}. Confirm your email to activate your account.</p>
    <p><a href="/auth/verify-email/{{ token }}/"
          style="background:#7c3aed;color:#fff;padding:10px 18px;
                 border-radius:8px;text-decoration:none">Confirm email</a></p>
    <p style="font-size:12px;color:#888">If you didn't create this account, ignore this message.</p>
</div>
